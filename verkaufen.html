<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto verkaufen – AUTOORA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #151515;
}

header {
  background: #111;
  color: white;
  padding: 22px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  color: #ccc;
}

main {
  max-width: 650px;
  margin: 30px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  font-size: 28px;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 17px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #333;
  text-decoration: none;
}

.success {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  background: #e8f7eb;
  text-align: center;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>AUTOORA</h1>
  <p>Autos einfach kaufen & verkaufen</p>
</header>

<main>

<div class="card">

<h2>🚗 Auto verkaufen</h2>

<p class="subtitle">
Erstelle dein Inserat auf AUTOORA.
</p>

<form id="carForm">

<label>Marke</label>
<input id="marke" type="text" placeholder="z.B. BMW" required>

<label>Modell</label>
<input id="modell" type="text" placeholder="z.B. X5" required>

<label>Baujahr</label>
<input id="baujahr" type="number" placeholder="z.B. 2020" required>

<label>Kilometerstand</label>
<input id="kilometer" type="number" placeholder="z.B. 80000" required>

<label>Preis in CHF</label>
<input id="preis" type="number" placeholder="z.B. 35000" required>

<label>Treibstoff</label>
<select id="treibstoff" required>
<option value="">Treibstoff wählen</option>
<option value="Benzin">Benzin</option>
<option value="Diesel">Diesel</option>
<option value="Hybrid">Hybrid</option>
<option value="Elektro">Elektro</option>
</select>

<label>Getriebe</label>
<select id="getriebe" required>
<option value="">Getriebe wählen</option>
<option value="Automatik">Automatik</option>
<option value="Manuell">Manuell</option>
</select>

<label>Beschreibung</label>
<textarea id="beschreibung"
placeholder="Beschreibe dein Fahrzeug"></textarea>

<label>Dein Name</label>
<input id="name" type="text" placeholder="Dein Name" required>

<label>Telefonnummer</label>
<input id="telefon" type="tel" placeholder="+41 ...">

<label>E-Mail-Adresse</label>
<input id="email" type="email" placeholder="name@beispiel.ch" required>

<button type="submit">
Inserat erstellen
</button>

</form>

<div id="success" class="success">
🎉 Dein Inserat wurde gespeichert!
</div>

<a class="back" href="Index.html">
← Zurück zur Startseite
</a>

</div>

</main>

<footer>
© 2026 AUTOORA · Autos kaufen & verkaufen
</footer>

<script>

const form = document.getElementById("carForm");

form.addEventListener("submit", function(event) {

  event.preventDefault();

  const inserat = {
    id: Date.now(),
    marke: document.getElementById("marke").value,
    modell: document.getElementById("modell").value,
    baujahr: document.getElementById("baujahr").value,
    kilometer: document.getElementById("kilometer").value,
    preis: document.getElementById("preis").value,
    treibstoff: document.getElementById("treibstoff").value,
    getriebe: document.getElementById("getriebe").value,
    beschreibung: document.getElementById("beschreibung").value,
    name: document.getElementById("name").value,
    telefon: document.getElementById("telefon").value,
    email: document.getElementById("email").value
  };

  let inserate = [];

  try {
    inserate =
      JSON.parse(localStorage.getItem("autooraInserate")) || [];
  } catch(error) {
    inserate = [];
  }

  inserate.push(inserat);

  localStorage.setItem(
    "autooraInserate",
    JSON.stringify(inserate)
  );

  document.getElementById("success").style.display = "block";

  form.reset();

  setTimeout(function() {
    window.location.href = "Index.html";
  }, 1200);

});

</script>

</body>
</html>
