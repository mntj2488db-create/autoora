<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto verkaufen | AUTOORA</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

header {
  background: white;
  padding: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 30px;
  font-weight: 900;
  text-decoration: none;
  color: #111;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 30px 20px;
}

h1 {
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitle {
  color: #666;
  margin-bottom: 30px;
}

.form-box {
  background: white;
  padding: 24px;
  border-radius: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 7px;
}

input, select, textarea {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 120px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 17px;
  border: 0;
  border-radius: 10px;
  background: #f56635;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.back {
  text-decoration: none;
  color: #111;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">AUTOORA</a>
  <a class="back" href="index.html">← Zurück</a>
</header>

<main>

<h1>Auto verkaufen</h1>
<p class="subtitle">Erstelle dein Inserat auf AUTOORA.</p>

<div class="form-box">

<form id="carForm">

<label>Fotos</label>
<input type="file" accept="image/*" multiple>

<label>Marke</label>
<select required>
<option value="">Marke auswählen</option>
<option>Audi</option>
<option>BMW</option>
<option>Mercedes-Benz</option>
<option>Volkswagen</option>
<option>Toyota</option>
<option>Ford</option>
<option>Opel</option>
<option>Škoda</option>
<option>Renault</option>
<option>Peugeot</option>
<option>Andere</option>
</select>

<label>Modell</label>
<input type="text" placeholder="z.B. BMW X5" required>

<label>Erstzulassung / Jahrgang</label>
<input type="number" placeholder="z.B. 2021" required>

<label>Kilometerstand</label>
<input type="number" placeholder="z.B. 65000" required>

<label>Preis in CHF</label>
<input type="number" placeholder="z.B. 29900" required>

<label>Treibstoff</label>
<select>
<option>Benzin</option>
<option>Diesel</option>
<option>Hybrid</option>
<option>Elektro</option>
</select>

<label>Getriebe</label>
<select>
<option>Automatik</option>
<option>Schaltgetriebe</option>
</select>

<label>Standort</label>
<input type="text" placeholder="z.B. Aarau">

<label>Beschreibung</label>
<textarea placeholder="Beschreibe dein Fahrzeug..."></textarea>

<label>Name</label>
<input type="text" placeholder="Dein Name" required>

<label>E-Mail</label>
<input type="email" placeholder="name@beispiel.ch" required>

<label>Telefon</label>
<input type="tel" placeholder="+41 ...">

<button type="submit">Inserat erstellen</button>

</form>

</div>
</main>

<script>
<script>
const form = document.getElementById("carForm");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const inputs = form.querySelectorAll("input");
  const selects = form.querySelectorAll("select");
  const textarea = form.querySelector("textarea");

  const inserat = {
    marke: inputs[0].value,
    modell: inputs[1].value,
    baujahr: inputs[2].value,
    kilometer: inputs[3].value,
    preis: inputs[4].value,
    treibstoff: selects[0] ? selects[0].value : "",
    getriebe: selects[1] ? selects[1].value : "",
    beschreibung: textarea ? textarea.value : "",
    name: inputs[6] ? inputs[6].value : "",
    email: inputs[7] ? inputs[7].value : "",
    telefon: inputs[8] ? inputs[8].value : ""
  };

  let inserate = JSON.parse(localStorage.getItem("autooraInserate")) || [];
  inserate.push(inserat);
  localStorage.setItem("autooraInserate", JSON.stringify(inserate));

  alert("🎉 Dein Inserat wurde gespeichert!");
  window.location.href = "index.html";
});
</script>
</script>

</body>
</html>
